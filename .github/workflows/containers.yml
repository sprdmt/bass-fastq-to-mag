# Build and publish the custom container images of bass-fastq-to-mag to GHCR.
#   ghcr.io/<owner>/bass-fastq-to-mag-<image>:<TOOL_VERSION>   and   :<TOOL_VERSION>-<short sha>
# Images and their versions: containers/<image>/build.env; recipes: containers/<image>/Dockerfile.
# Each image installs the explicit pin file workflow/envs/<env>.linux-64.pin.txt, so only images whose
# recipe, env YAML or pin file changed are rebuilt. Pull requests build without pushing.
name: containers

on:
  push:
    branches: [main]
    paths:
      - 'containers/**'
      - 'workflow/envs/genomeface.*'
      - 'workflow/envs/semibin2-gpu.*'
      - 'workflow/envs/vamb-gpu.*'
      - 'workflow/envs/taxconverter.*'
      - 'workflow/envs/anvio.*'
      - 'workflow/envs/helpers.*'
      - '.github/workflows/containers.yml'
  pull_request:
    paths:
      - 'containers/**'
      - 'workflow/envs/genomeface.*'
      - 'workflow/envs/semibin2-gpu.*'
      - 'workflow/envs/vamb-gpu.*'
      - 'workflow/envs/taxconverter.*'
      - 'workflow/envs/anvio.*'
      - 'workflow/envs/helpers.*'
      - '.github/workflows/containers.yml'
  workflow_dispatch:
    inputs:
      images:
        description: 'JSON list of images to build'
        required: false
        default: '["genomeface","semibin2-gpu","vamb-gpu","anvio","helpers"]'

permissions:
  contents: read
  packages: write

concurrency:
  group: containers-${{ github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      images: ${{ steps.select.outputs.images }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            genomeface:
              - 'containers/genomeface/**'
              - 'workflow/envs/genomeface.*'
            semibin2-gpu:
              - 'containers/semibin2-gpu/**'
              - 'workflow/envs/semibin2-gpu.*'
            vamb-gpu:
              - 'containers/vamb-gpu/**'
              - 'workflow/envs/vamb-gpu.*'
              - 'workflow/envs/taxconverter.*'
            anvio:
              - 'containers/anvio/**'
              - 'workflow/envs/anvio.*'
            helpers:
              - 'containers/helpers/**'
              - 'workflow/envs/helpers.*'
            all:
              - '.github/workflows/containers.yml'
      - id: select
        env:
          EVENT: ${{ github.event_name }}
          DISPATCH: ${{ github.event.inputs.images }}
          CHANGES: ${{ steps.filter.outputs.changes }}
        run: |
          ALL='["genomeface","semibin2-gpu","vamb-gpu","anvio","helpers"]'
          if [ "$EVENT" = "workflow_dispatch" ]; then
            SEL="${DISPATCH:-$ALL}"
          elif echo "$CHANGES" | grep -q '"all"'; then
            SEL="$ALL"
          else
            SEL="$CHANGES"
          fi
          echo "Selected images: $SEL"
          echo "images=$SEL" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: ${{ needs.changes.outputs.images != '' && needs.changes.outputs.images != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        image: ${{ fromJSON(needs.changes.outputs.images) }}
    steps:
      # The GPU images are 5-10 GB; the hosted runner needs space for layers and the build cache.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost /usr/share/swift
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v7

      - name: Read image settings
        id: cfg
        run: |
          set -a; . "containers/${{ matrix.image }}/build.env"; set +a
          echo "tool_version=${TOOL_VERSION}" >> "$GITHUB_OUTPUT"
          echo "cuda=${CONDA_OVERRIDE_CUDA:-}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        if: github.event_name != 'pull_request'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository_owner }}/bass-fastq-to-mag-${{ matrix.image }}
          tags: |
            type=raw,value=${{ steps.cfg.outputs.tool_version }}
            type=sha,prefix=${{ steps.cfg.outputs.tool_version }}-,format=short
          labels: |
            org.opencontainers.image.title=bass-fastq-to-mag-${{ matrix.image }}
            org.opencontainers.image.version=${{ steps.cfg.outputs.tool_version }}

      - uses: docker/build-push-action@v7
        id: build
        with:
          context: .
          file: containers/${{ matrix.image }}/Dockerfile
          platforms: linux/amd64
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            TOOL_VERSION=${{ steps.cfg.outputs.tool_version }}
            CONDA_OVERRIDE_CUDA=${{ steps.cfg.outputs.cuda }}
          # single-platform manifests keep `apptainer pull docker://...` simple
          provenance: false
          sbom: false

      - name: Summary
        run: |
          {
            echo "### bass-fastq-to-mag-${{ matrix.image }}"
            echo '```'
            echo "${{ steps.meta.outputs.tags }}"
            echo "digest: ${{ steps.build.outputs.digest }}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
