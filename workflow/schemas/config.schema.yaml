$schema: "https://json-schema.org/draft/2020-12/schema"
description: Configuration of the bass-fastq-to-mag workflow (defaults are filled in here)
type: object

properties:
  project:
    type: string
    pattern: "^[A-Za-z][A-Za-z0-9_-]*$"
    description: Project name; prefix of the final MAG names ({project}_MAG_{n}) and the default assembly group
  samples:
    type: string
    default: config/samples.tsv
  outdir:
    type: string
    default: results

  qc:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: true, description: "false = use the FASTQ files from the sample sheet as they are"}
      adapter_r1: {type: string, default: AGATCGGAAGAGCACACGTCTGAACTCCAGTCAC}
      adapter_r2: {type: string, default: AGATCGGAAGAGCGTCGTGTAGGGAAAGAGTGT}
      adapter_mode:
        type: string
        enum: [anywhere, three_prime]
        default: anywhere
        description: "anywhere = cutadapt -b/-B (as in the original workflow); three_prime = -a/-A"
      quality_cutoff: {type: string, default: "20,20"}
      nextseq_trim: {type: ["integer", "null"], default: 20, description: "two-colour chemistry poly-G trimming; null to disable"}
      cut_r1: {type: integer, default: 9, description: "bases removed from the 5' end of read 1 (cutadapt -u)"}
      cut_r2: {type: integer, default: 9}
      minimum_length: {type: integer, default: 50}
      overlap: {type: integer, default: 5}
      pair_filter: {type: string, enum: [any, both, first], default: any}
      extra: {type: string, default: ""}
      fastqc: {type: boolean, default: true}

  assembly:
    type: object
    default: {}
    properties:
      k_min: {type: integer, default: 25}
      k_max: {type: integer, default: 125}
      k_step: {type: integer, default: 10}
      k_list: {type: string, default: "", description: "comma-separated list; overrides k_min/k_max/k_step"}
      min_contig_len: {type: integer, default: 1000}
      min_count: {type: integer, default: 2}
      memory_fraction: {type: number, default: 0.9, description: "share of the job memory given to MEGAHIT -m"}
      workdir: {type: string, default: "", description: "directory for MEGAHIT intermediates; empty = inside outdir; e.g. $TMPDIR for node-local disk"}
      extra: {type: string, default: ""}
      quast: {type: boolean, default: true}

  graph:
    type: object
    default: {}
    properties:
      require_edges: {type: boolean, default: true, description: "stop when the assembly graph has no edges (graph refinement would do nothing)"}

  genes:
    type: object
    default: {}
    properties:
      procedure: {type: string, enum: [meta, single], default: meta}
      chunksize: {type: integer, default: 20000}

  mapping:
    type: object
    default: {}
    properties:
      bowtie2_extra: {type: string, default: "--no-unal"}

  binning:
    type: object
    default: {}
    properties:
      binners:
        type: array
        items: {type: string, enum: [metabat2, genomeface, semibin2, vamb]}
        minItems: 1
        uniqueItems: true
        default: [metabat2, genomeface, semibin2, vamb]
      metabat2:
        type: object
        default: {}
        properties:
          min_contig: {type: integer, default: 1500}
          min_bin_size: {type: integer, default: 100000}
          seed: {type: integer, default: 1}
          extra: {type: string, default: ""}
      genomeface:
        type: object
        default: {}
        properties:
          marker_chunks: {type: integer, minimum: 1, default: 24}
          min_contig: {type: integer, default: 1500, description: "genomeface -m"}
          min_purity: {type: number, default: 85, description: "genomeface -p: minimum marker-estimated purity (%) of output clusters"}
          extra: {type: string, default: ""}
      semibin2:
        type: object
        default: {}
        properties:
          min_len: {type: integer, default: 2500}
          extra: {type: string, default: ""}
      vamb:
        type: object
        default: {}
        properties:
          min_contig: {type: integer, default: 1000}
          min_fasta: {type: integer, default: 200000}
          extra: {type: string, default: ""}
          mmseqs_gpu: {type: boolean, default: true, description: "use MMseqs2 GPU search (needs a GPU-padded database)"}
          mmseqs_extra: {type: string, default: "--tax-lineage 1 --lca-ranks superkingdom,phylum,class,order,family,genus,species --max-seq-len 1500000"}

  graphbin2:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: true}
      binette_input:
        type: string
        enum: [both, refined]
        default: both
        description: "both = original and GraphBin2 bins go to Binette; refined = GraphBin2 bins only"
      depth: {type: integer, default: 5}
      threshold: {type: number, default: 1.5}

  binette:
    type: object
    default: {}
    properties:
      min_completeness: {type: number, default: 70}
      extra: {type: string, default: ""}

  drep:
    type: object
    default: {}
    properties:
      ani: {type: number, default: 0.995, description: "secondary ANI threshold (-sa); 0.95 gives species-level representatives"}
      min_completeness: {type: number, default: 50}
      max_contamination: {type: number, default: 10}
      extra: {type: string, default: ""}

  mags:
    type: object
    default: {}
    properties:
      source:
        type: string
        enum: [auto, anvio]
        default: auto
        description: "auto = Binette bins; anvio = bins kept by the anvi'o triage plus the manually refined collection 'Refine'"
      min_completeness: {type: number, default: 50, minimum: 0, maximum: 100}
      max_contamination: {type: number, default: 10, minimum: 0}
      rna:
        type: object
        default: {}
        properties:
          exclude_partial_rrna: {type: boolean, default: false}
          trna_mode: {type: string, enum: [standard20, legacy], default: standard20}
          min_trna: {type: integer, default: 18, minimum: 0}
      coverage_method: {type: string, enum: [sum_mean, length_weighted], default: sum_mean}

  gtdbtk:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: true}
      extra: {type: string, default: "--skip_ani_screen"}

  anvio:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: false}
      min_contig_len: {type: integer, default: 1000}
      scg_taxonomy: {type: boolean, default: true}
      review:
        type: string
        enum: [contaminated, all]
        default: contaminated
        description: "contaminated = only nearly complete, contaminated bins go into the collection 'Refine'; all = every Binette bin"
      refine_min_completeness:
        type: number
        default: 90
        minimum: 0
        maximum: 100
        description: "bins below this completeness are not offered for refinement (refinement cannot raise completeness)"
      refine_contamination_above:
        type: number
        default: 5
        minimum: 0
        description: "bins with contamination above this value (and enough completeness) are offered for refinement; 5 = MIMAG high-quality limit"

  databases:
    type: object
    default: {}
    properties:
      checkm2: {type: string, default: "", description: "CheckM2 DIAMOND database (.dmnd)"}
      gtdbtk: {type: string, default: "", description: "GTDB-Tk reference data directory (GTDBTK_DATA_PATH)"}
      mmseqs2_taxonomy: {type: string, default: "", description: "MMseqs2 taxonomy database prefix for TaxVAMB"}
      anvio_scg: {type: string, default: "", description: "anvi'o SCG-taxonomy data directory; empty = the one inside the container"}
      download_dir: {type: string, default: databases, description: "target of `snakemake download_databases`"}
      gtdbtk_url: {type: string, default: "https://data.gtdb.ecogenomic.org/releases/release226/226.0/auxillary_files/gtdbtk_package/full_package/gtdbtk_r226_data.tar.gz"}
      mmseqs2_download: {type: string, default: GTDB, description: "database name for `mmseqs databases` (e.g. GTDB, UniRef90)"}
      gtdb_metadata_url: {type: string, default: "https://data.gtdb.ecogenomic.org/releases/release226/226.0", description: "GTDB release directory with bac120/ar53 metadata (ENA lineages)"}

  gpu:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: true}
      request: {type: string, enum: [gres, gpus, none], default: gres}
      gres: {type: string, default: "gpu:1", description: "SLURM --gres value for one GPU (LiSC: shard:2)"}
      count: {type: integer, default: 1}

  containers:
    type: object
    default: {}
    description: Overrides of workflow/containers.yaml (e.g. local .sif paths)

  resources:
    type: object
    default: {}
    description: Overrides of workflow/resources.yaml (limits, retry_factor, partitions, per-rule coefficients)

  ena:
    type: object
    default: {}
    properties:
      enabled: {type: boolean, default: false}
      study: {type: string, default: ""}
      centre_name: {type: string, default: ""}
      genome_type: {type: string, enum: [bins, mags], default: bins}
      private: {type: boolean, default: true}
      min_completeness: {type: number, default: 50}
      max_contamination: {type: number, default: 10}
      metagenome: {type: string, default: "seawater metagenome"}
      metagenome_taxid: {type: integer, default: 1561972}
      broad_environment: {type: string, default: "marine biome [ENVO:00000447]"}
      local_environment: {type: string, default: ""}
      environmental_medium: {type: string, default: ""}
      assembly_software: {type: string, default: ""}
      binning_software: {type: string, default: ""}
      binning_parameters: {type: string, default: "default"}
      stats_generation_software: {type: string, default: ""}
      groups: {type: object, default: {}}
      lineage_method: {type: string, enum: [majority_vote, mapping_table, consensus], default: majority_vote}
      lineage_cross_check: {type: boolean, default: false}
      lineage_max_rank: {type: string, enum: [phylum, class, order, family, genus, species], default: genus}
      gtdb_metadata:
        type: object
        default: {}
        properties:
          bac120: {type: string, default: ""}
          ar53: {type: string, default: ""}
      gtdb_ncbi_workbooks: {type: array, items: {type: string}, default: []}
      taxdump: {type: string, default: ""}
      coassembly:
        type: object
        default: {}
        properties:
          submit_primary: {type: boolean, default: true}
          sample_alias_prefix: {type: string, default: ""}
          checklist: {type: string, default: ERC000011}
          attributes: {type: object, default: {}}
          program: {type: string, default: ""}
          platform: {type: string, default: ILLUMINA}
      webin:
        type: object
        default: {}
        properties:
          java_heap_max_gb: {type: integer, default: 4}
          delay_s: {type: number, default: 2}

required: [project]
