# helpers: Python for workflow/scripts/*.py (tables, renaming, GTDB->NCBI mapping from .xlsx).
# Image (custom): ghcr.io/sprdmt/bass-fastq-to-mag-helpers:1.0.0
# Channel priority: strict (conda config --set channel_priority strict).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - pandas=2.2
  - numpy=2.2
  - biopython=1.85
  - pyyaml=6.0
  - openpyxl=3.1
