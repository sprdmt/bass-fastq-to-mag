# graphbin2: assembly-graph refinement of each binner (the corrected fast script runs inside this env).
# Pin: 1.3.3 (latest; = user's graphbin2-patched env version). Build pyhdfd78af_1 (2026-06, python<3.13): its image ships
# Python 3.12.13 / python-igraph 1.0.0, closest to the user's Python 3.13.5 env; the older build pyh7e72e81_0 image ships
# Python 3.9.20 (checked on LiSC), on which the corrected script would also have to run.
# Image: quay.io/biocontainers/graphbin2:1.3.3--pyhdfd78af_1
# Channel priority: strict (conda config --set channel_priority strict).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.12
  - graphbin2=1.3.3=pyhdfd78af_1
  - python-igraph=1.0
