# multiqc: aggregate cutadapt/FastQC/QUAST reports.
# Pin: 1.35 (not used before; latest release, also the newest LiSC central env MultiQC-1.35).
# Image: quay.io/biocontainers/multiqc:1.35--pyhdfd78af_2
# python pinned to 3.14 = the python in the image (checked on LiSC).
# Channel priority: strict (conda config --set channel_priority strict).
channels:
  - conda-forge
  - bioconda
  - nodefaults
dependencies:
  - python=3.14
  - multiqc=1.35
