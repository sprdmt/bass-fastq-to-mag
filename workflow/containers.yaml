# Container image of every software environment (one per workflow/envs/<name>.yaml).
# Verified on LiSC on 2026-10-31 (containers/manifest.tsv). Images of this repository
# (ghcr.io/sprdmt/...) are built by .github/workflows/containers.yml. Override any entry under
# `containers:` in config/config.yaml, e.g. with a local .sif file.

